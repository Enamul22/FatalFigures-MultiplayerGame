# One server only. Follow docs/HOSTING.md for controlled releases; never use a rolling deploy.
services:
  - type: web
    name: fatalfigures-enamul22
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/Enamul22/FatalFigures-MultiplayerGame
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # A stopped old build may resume only as a parked process. Only the approved
    # exact commit can start Node and acquire the unchanged database lease.
    dockerCommand: >-
      /bin/sh -c 'if [ -z "$FATAL_RELEASE_COMMIT" ] || [ "$RENDER_GIT_COMMIT" != "$FATAL_RELEASE_COMMIT" ]; then echo "Release parked: build $RENDER_GIT_COMMIT is not approved $FATAL_RELEASE_COMMIT"; exec sleep 86400; fi; exec node dist/server/index.js'
    numInstances: 1
    autoDeployTrigger: "off"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: ORIGIN
        value: https://fatalfigures-enamul22.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: FATAL_RELEASE_COMMIT
        sync: false
