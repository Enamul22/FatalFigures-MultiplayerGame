# One server only. Follow docs/HOSTING.md for controlled releases; never use an unattended rolling deploy.
services:
  - type: web
    name: fatalfigures-enamul22
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/Enamul22/FatalFigures-MultiplayerGame
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Each replacement must match its approved full SHA before starting Node.
    # Resume reuses the previous successful deployment configuration.
    dockerCommand: /app/render-start.sh
    numInstances: 1
    autoDeployTrigger: "off"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: ORIGIN
        value: https://fatalfigures-enamul22.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: FATAL_RELEASE_COMMIT
        sync: false
      - key: FATAL_LEASE_WAIT_MS
        value: "180000"
