services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: fatalfigures
      POSTGRES_USER: fatalfigures
      POSTGRES_PASSWORD: local-game-only
    ports: ["127.0.0.1:5544:5432"]
    volumes: ["fatalfigures-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fatalfigures"]
      interval: 3s
      retries: 10
  game:
    build: .
    profiles: ["game"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://fatalfigures:local-game-only@db:5432/fatalfigures
      DATABASE_URL_UNPOOLED: postgresql://fatalfigures:local-game-only@db:5432/fatalfigures
      ORIGIN: ${ORIGIN:-https://game.example.com}
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  fatalfigures-data:
